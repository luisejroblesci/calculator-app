version: 2.1

jobs:
  lint-and-test:
    docker:
      - image: cimg/node:26.10
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Test
          command: npm test

workflows:
  build:
    jobs:
      - lint-and-test
