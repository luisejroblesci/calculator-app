<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <div class="display">
      <div class="expression" id="expression" aria-live="polite"></div>
      <div class="value" id="value" aria-live="polite">0</div>
    </div>

    <div class="ops-row">
      <button class="key fn" data-action="clear">C</button>
      <button class="key fn" data-action="backspace" aria-label="Backspace">⌫</button>
      <button class="key op" data-action="subtract" aria-label="Minus">−</button>
      <button class="key op" data-action="add" aria-label="Plus">+</button>
    </div>

    <div class="keys">
      <button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button>
      <button class="key" data-digit="9">9</button>

      <button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
      <button class="key" data-digit="6">6</button>

      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button>

      <button class="key" data-digit="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key eq" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
